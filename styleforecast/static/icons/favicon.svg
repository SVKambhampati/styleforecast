<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#C4622D"/>
  <!-- Coat hanger: hook + shoulders + bar -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook -->
    <path d="M15.5 6 Q15.5 3.5 18 3.5 Q20.5 3.5 20.5 6.5 Q20.5 9.5 15.5 11" stroke-width="1.8"/>
    <!-- Shoulders (V shape) -->
    <polyline points="15.5,11 3.5,24 28.5,24" stroke-width="1.8"/>
    <!-- Bottom bar -->
    <line x1="2" y1="24" x2="30" y2="24" stroke-width="2.2"/>
  </g>
</svg>
